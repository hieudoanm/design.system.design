<svg viewBox='0 0 640 180' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Elevation in dark mode: shadows adapt, level numbers stay the same</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Elevation in Dark Mode</text>
<rect x='60' y='60' width='120' height='60' rx='8' fill='var(--color-paper)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='120' y='84' font-size='10' text-anchor='middle' fill='var(--color-mute)'>level-2 light</text>
<text x='120' y='100' font-size='8' text-anchor='middle' fill='var(--color-mute)'>soft, low-opacity shadow</text>
<rect x='60' y='60' width='120' height='60' rx='8' fill='var(--color-ink)' opacity='0.06'/>
<rect x='340' y='60' width='120' height='60' rx='8' fill='var(--color-paper)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='400' y='84' font-size='10' text-anchor='middle' fill='var(--color-mute)'>level-2 dark</text>
<text x='400' y='100' font-size='8' text-anchor='middle' fill='var(--color-mute)'>lighter shadow on dark</text>
<rect x='340' y='60' width='120' height='60' rx='8' fill='var(--color-ink)' opacity='0.18'/>
<text x='60' y='150' font-size='9' fill='var(--color-mute)'>Keep the level; adjust colour, spread and opacity.</text>
<text x='60' y='168' font-size='9' fill='var(--color-mute)'>Never invert: larger or darker shadows read as blobs.</text>
</svg>
