<svg viewBox='0 0 640 200' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Color palette showing primitive and semantic color tokens</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Primitives</text>
<rect x='24' y='40' width='60' height='60' rx='6' fill='#111827'/>
<text x='54' y='120' font-size='9' text-anchor='middle' fill='var(--color-mute)'>gray-900</text>
<rect x='94' y='40' width='60' height='60' rx='6' fill='#f3f4f6' stroke='var(--color-rule)' stroke-width='1'/>
<text x='124' y='120' font-size='9' text-anchor='middle' fill='var(--color-mute)'>gray-50</text>
<rect x='164' y='40' width='60' height='60' rx='6' fill='#1f4fd8'/>
<text x='194' y='120' font-size='9' text-anchor='middle' fill='var(--color-mute)'>blue-600</text>
<rect x='234' y='40' width='60' height='60' rx='6' fill='#059669'/>
<text x='264' y='120' font-size='9' text-anchor='middle' fill='var(--color-mute)'>emerald-600</text>
<rect x='304' y='40' width='60' height='60' rx='6' fill='#d97706'/>
<text x='334' y='120' font-size='9' text-anchor='middle' fill='var(--color-mute)'>amber-600</text>
<rect x='374' y='40' width='60' height='60' rx='6' fill='#dc2626'/>
<text x='404' y='120' font-size='9' text-anchor='middle' fill='var(--color-mute)'>red-600</text>
<text x='24' y='160' font-size='12' font-weight='600' fill='var(--color-ink)'>Semantics</text>
<rect x='24' y='176' width='40' height='40' rx='6' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='44' y='236' font-size='8' text-anchor='middle' fill='var(--color-mute)'>surface</text>
<rect x='74' y='176' width='40' height='40' rx='6' fill='var(--color-ink)'/>
<text x='94' y='236' font-size='8' text-anchor='middle' fill='var(--color-mute)'>text</text>
<rect x='124' y='176' width='40' height='40' rx='6' fill='var(--color-action-bg)'/>
<text x='144' y='236' font-size='8' text-anchor='middle' fill='var(--color-mute)'>action</text>
<rect x='174' y='176' width='40' height='40' rx='6' fill='var(--color-success)'/>
<text x='194' y='236' font-size='8' text-anchor='middle' fill='var(--color-mute)'>success</text>
<rect x='224' y='176' width='40' height='40' rx='6' fill='var(--color-warning)'/>
<text x='244' y='236' font-size='8' text-anchor='middle' fill='var(--color-mute)'>warning</text>
<rect x='274' y='176' width='40' height='40' rx='6' fill='var(--color-danger)'/>
<text x='294' y='236' font-size='8' text-anchor='middle' fill='var(--color-mute)'>danger</text>
</svg>
