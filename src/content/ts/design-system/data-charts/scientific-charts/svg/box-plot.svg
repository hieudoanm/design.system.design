<line x1='185' y1='130' x2='215' y2='130' stroke-width='2' />
</g>

<g stroke='var(--color-chart-3)' stroke-width='1.5'>
<line x1='295' y1='100' x2='295' y2='130' />
<line x1='295' y1='220' x2='295' y2='190' />
<line x1='280' y1='100' x2='310' y2='100' />
<line x1='280' y1='220' x2='310' y2='220' />
<rect x='280' y='190' width='30' height='-60' fill='var(--color-chart-3)' fill-opacity='0.3' />
<line x1='280' y1='165' x2='310' y2='165' stroke-width='2' />
</g>
<circle cx='295' cy='230' r='3' fill='var(--color-chart-3)' /><circle cx='295' cy='65' r='3' fill='var(--color-chart-3)' />
<g stroke='var(--color-chart-4)' stroke-width='1.5'>
<line x1='390' y1='90' x2='390' y2='110' />
