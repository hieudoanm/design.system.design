<svg viewBox='0 0 520 280' width='100%' role='img' aria-labelledby='scientific-qq-plot' xmlns='http://www.w3.org/2000/svg'>
<title id='scientific-qq-plot'>Q-Q plot: sample quantiles vs. theoretical normal quantiles. Points on the diagonal indicate normality.</title>
<g stroke='var(--color-rule)' stroke-width='1' fill='none'>
<line x1='60' y1='20' x2='420' y2='240' />
</g>
<line x1='60' y1='20' x2='60' y2='240' stroke='var(--color-rule)' stroke-width='1' /><line x1='60' y1='240' x2='460' y2='240' stroke='var(--color-ink)' stroke-opacity='0.45' stroke-width='1' />
<g font-size='11' fill='var(--color-mute)' text-anchor='middle'><text x='60' y='258'>-2.5</text><text x='132' y='258'>-1.5</text><text x='204' y='258'>-0.5</text><text x='276' y='258'>0.5</text><text x='348' y='258'>1.5</text><text x='420' y='258'>2.5</text></g>
<circle cx='96' cy='222.4' r='4' fill='var(--color-chart-1)' /><circle cx='132' cy='200.4' r='4' fill='var(--color-chart-1)' /><circle cx='168' cy='178.4' r='4' fill='var(--color-chart-1)' /><circle cx='204' cy='147.6' r='4' fill='var(--color-chart-1)' /><circle cx='240' cy='125.6' r='4' fill='var(--color-chart-1)' /><circle cx='276' cy='103.6' r='4' fill='var(--color-chart-1)' /><circle cx='312' cy='77.19999999999999' r='4' fill='var(--color-chart-1)' /><circle cx='348' cy='68.4' r='4' fill='var(--color-chart-1)' /><circle cx='384' cy='37.60000000000002' r='4' fill='var(--color-chart-1)' />
<text x='60' y='20' font-size='11' fill='var(--color-mute)'>Sample quantiles</text>
<text x='420' y='260' font-size='11' fill='var(--color-mute)'>Theoretical quantiles</text>
<text x='430' y='46' font-size='12' font-weight='600' fill='var(--color-chart-1)'>y = x</text>
</svg>
