<svg viewBox='0 0 640 200' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Layout spacing showing margin, padding, and gap</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Margin • Padding • Gap</text>
<rect x='60' y='50' width='200' height='120' rx='8' fill='none' stroke='var(--color-rule)' stroke-width='1' stroke-dasharray='4 2'/>
<text x='160' y='45' font-size='8' text-anchor='middle' fill='var(--color-mute)'>margin: 24px</text>
<rect x='80' y='70' width='160' height='80' rx='6' fill='var(--color-surface)' stroke='var(--color-action-bg)' stroke-width='1'/>
<text x='160' y='65' font-size='8' text-anchor='middle' fill='var(--color-action-bg)'>padding: 20px</text>
<rect x='90' y='80' width='60' height='60' rx='4' fill='var(--color-action-bg)' opacity='0.3'/>
<rect x='170' y='80' width='60' height='60' rx='4' fill='var(--color-action-bg)' opacity='0.3'/>
<text x='150' y='115' font-size='8' text-anchor='middle' fill='var(--color-action-bg)'>gap: 20px</text>
<text x='120' y='112' font-size='9' text-anchor='middle' fill='var(--color-ink)'>Item 1</text>
<text x='200' y='112' font-size='9' text-anchor='middle' fill='var(--color-ink)'>Item 2</text>
<rect x='320' y='50' width='280' height='120' rx='8' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<rect x='340' y='70' width='240' height='20' rx='4' fill='var(--color-action-bg)' opacity='0.2'/>
<text x='460' y='83' font-size='9' text-anchor='middle' fill='var(--color-ink)'>Header (space-6)</text>
<rect x='340' y='100' width='70' height='50' rx='4' fill='var(--color-action-bg)' opacity='0.2'/>
<text x='375' y='128' font-size='8' text-anchor='middle' fill='var(--color-ink)'>Nav</text>
<rect x='420' y='100' width='160' height='50' rx='4' fill='var(--color-action-bg)' opacity='0.2'/>
<text x='500' y='128' font-size='8' text-anchor='middle' fill='var(--color-ink)'>Content (space-4 gap)</text>
<text x='460' y='45' font-size='10' text-anchor='middle' fill='var(--color-mute)'>Vertical Rhythm</text>
</svg>
