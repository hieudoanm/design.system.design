<svg viewBox='0 0 640 180' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>The life of a design system change: proposal to adoption</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Life of a change</text>
<rect x='24' y='56' width='104' height='48' rx='8' fill='var(--color-paper)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='76' y='84' font-size='9' text-anchor='middle' fill='var(--color-ink)'>proposal</text>
<rect x='152' y='56' width='104' height='48' rx='8' fill='var(--color-paper)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='204' y='84' font-size='9' text-anchor='middle' fill='var(--color-ink)'>review</text>
<rect x='280' y='56' width='104' height='48' rx='8' fill='var(--color-paper)' stroke='var(--color-cobalt)' stroke-width='1.5'/>
<text x='332' y='84' font-size='9' text-anchor='middle' fill='var(--color-ink)'>build</text>
<rect x='408' y='56' width='104' height='48' rx='8' fill='var(--color-paper)' stroke='var(--color-cobalt)' stroke-width='1.5'/>
<text x='460' y='84' font-size='9' text-anchor='middle' fill='var(--color-ink)'>release</text>
<rect x='536' y='56' width='80' height='48' rx='8' fill='var(--color-ink)' opacity='0.9'/>
<text x='576' y='84' font-size='9' text-anchor='middle' fill='var(--color-paper)'>adopt</text>
<path d='M128 80 H152 M256 80 H280 M384 80 H408 M512 80 H536' stroke='var(--color-mute)' stroke-width='1.5'/>
<text x='24' y='140' font-size='9' fill='var(--color-mute)'>A change is a product decision, not a pull request alone.</text>
<text x='24' y='158' font-size='9' fill='var(--color-mute)'>Documentation and the changelog ship with the code.</text>
</svg>
