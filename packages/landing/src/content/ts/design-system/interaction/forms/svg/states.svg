<svg viewBox='0 0 640 180' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Form input states: default, focus, error, disabled, success</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Input States</text>
<text x='30' y='55' font-size='9' fill='var(--color-mute)'>Default</text>
<rect x='30' y='65' width='140' height='36' rx='6' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='45' y='86' font-size='9' fill='var(--color-mute)'>Placeholder</text>
<text x='190' y='55' font-size='9' fill='var(--color-mute)'>Focus</text>
<rect x='190' y='65' width='140' height='36' rx='6' fill='var(--color-surface)' stroke='var(--color-action-bg)' stroke-width='2'/>
<text x='205' y='86' font-size='9' fill='var(--color-ink)'>Typing...</text>
<text x='350' y='55' font-size='9' fill='var(--color-mute)'>Success</text>
<rect x='350' y='65' width='140' height='36' rx='6' fill='var(--color-surface)' stroke='var(--color-success)' stroke-width='1'/>
<text x='365' y='86' font-size='9' fill='var(--color-ink)'>valid@email.com</text>
<circle cx='475' cy='83' r='6' fill='var(--color-success)'/>
<text x='30' y='125' font-size='9' fill='var(--color-mute)'>Error</text>
<rect x='30' y='135' width='140' height='36' rx='6' fill='var(--color-surface)' stroke='var(--color-danger)' stroke-width='1'/>
<text x='45' y='156' font-size='9' fill='var(--color-ink)'>invalid</text>
<circle cx='155' cy='153' r='6' fill='var(--color-danger)'/>
<text x='190' y='125' font-size='9' fill='var(--color-mute)'>Disabled</text>
<rect x='190' y='135' width='140' height='36' rx='6' fill='var(--color-paper)' stroke='var(--color-rule)' stroke-width='1' opacity='0.5'/>
<text x='205' y='156' font-size='9' fill='var(--color-mute)' opacity='0.5'>Disabled</text>
<text x='350' y='125' font-size='9' fill='var(--color-mute)'>Readonly</text>
<rect x='350' y='135' width='140' height='36' rx='6' fill='var(--color-paper)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='365' y='156' font-size='9' fill='var(--color-ink)'>Read only value</text>
</svg>
