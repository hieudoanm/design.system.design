<svg viewBox='0 0 640 180' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Grid example: 12-column with gutters</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>12-Column Grid</text>
<g fill='var(--color-rule)' opacity='0.5'>
  <rect x='24' y='40' width='36' height='100' rx='2'/>
  <rect x='68' y='40' width='36' height='100' rx='2'/>
  <rect x='112' y='40' width='36' height='100' rx='2'/>
  <rect x='156' y='40' width='36' height='100' rx='2'/>
  <rect x='200' y='40' width='36' height='100' rx='2'/>
  <rect x='244' y='40' width='36' height='100' rx='2'/>
  <rect x='288' y='40' width='36' height='100' rx='2'/>
  <rect x='332' y='40' width='36' height='100' rx='2'/>
  <rect x='376' y='40' width='36' height='100' rx='2'/>
  <rect x='420' y='40' width='36' height='100' rx='2'/>
  <rect x='464' y='40' width='36' height='100' rx='2'/>
  <rect x='508' y='40' width='36' height='100' rx='2'/>
</g>
<rect x='24' y='60' width='124' height='20' rx='4' fill='var(--color-cobalt)' opacity='0.8'/>
<text x='86' y='73' font-size='8' text-anchor='middle' fill='var(--color-paper)'>col-3</text>
<rect x='156' y='60' width='212' height='20' rx='4' fill='var(--color-cobalt)' opacity='0.8'/>
<text x='262' y='73' font-size='8' text-anchor='middle' fill='var(--color-paper)'>col-6</text>
<rect x='376' y='60' width='168' height='20' rx='4' fill='var(--color-cobalt)' opacity='0.8'/>
<text x='460' y='73' font-size='8' text-anchor='middle' fill='var(--color-paper)'>col-3</text>
<rect x='24' y='90' width='256' height='20' rx='4' fill='var(--color-marker)' opacity='0.8'/>
<text x='152' y='103' font-size='8' text-anchor='middle' fill='var(--color-paper)'>col-7</text>
<rect x='288' y='90' width='256' height='20' rx='4' fill='var(--color-marker)' opacity='0.8'/>
