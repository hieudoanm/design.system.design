<svg viewBox='0 0 520 280' width='100%' role='img' aria-labelledby='scientific-box-plot' xmlns='http://www.w3.org/2000/svg'>
<title id='scientific-box-plot'>Box plots comparing four groups: quartiles, median, whiskers, and outliers</title>
<g stroke='var(--color-rule)' stroke-width='1' fill='none'><line x1='60' y1='240' x2='460' y2='240' /><line x1='60' y1='190' x2='460' y2='190' /><line x1='60' y1='140' x2='460' y2='140' /><line x1='60' y1='90' x2='460' y2='90' /><line x1='60' y1='40' x2='460' y2='40' /></g><g font-size='11' fill='var(--color-mute)' text-anchor='end'><text x='52' y='244'>0</text><text x='52' y='194'>10</text><text x='52' y='144'>20</text><text x='52' y='94'>30</text><text x='52' y='44'>40</text></g>
<line x1='60' y1='20' x2='60' y2='240' stroke='var(--color-rule)' stroke-width='1' /><line x1='60' y1='240' x2='460' y2='240' stroke='var(--color-ink)' stroke-opacity='0.45' stroke-width='1' />
<g font-size='11' fill='var(--color-mute)' text-anchor='middle'><text x='90' y='258'>Control</text><text x='185' y='258'>Treatment A</text><text x='280' y='258'>Treatment B</text><text x='375' y='258'>Treatment C</text></g>
<g stroke='var(--color-chart-1)' stroke-width='1.5'>
<line x1='105' y1='90' x2='105' y2='120' />
<line x1='105' y1='210' x2='105' y2='180' />
<line x1='90' y1='90' x2='120' y2='90' />
<line x1='90' y1='210' x2='120' y2='210' />
