<svg viewBox='0 0 640 160' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Form validation patterns: inline, summary, and real-time</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Validation Strategies</text>
<text x='80' y='50' font-size='9' text-anchor='middle' fill='var(--color-mute)'>Inline Errors</text>
<rect x='40' y='60' width='80' height='24' rx='4' fill='var(--color-surface)' stroke='var(--color-danger)' stroke-width='1'/>
<text x='80' y='75' font-size='8' text-anchor='middle' fill='var(--color-ink)'>bad@</text>
<text x='40' y='95' font-size='7' fill='var(--color-danger)'>Invalid email</text>
<text x='220' y='50' font-size='9' text-anchor='middle' fill='var(--color-mute)'>Error Summary</text>
<rect x='180' y='60' width='80' height='40' rx='4' fill='var(--color-danger-bg)' stroke='var(--color-danger)' stroke-width='1'/>
<circle cx='190' cy='70' r='3' fill='var(--color-danger)'/>
<text x='198' y='73' font-size='6' fill='var(--color-danger)'>Fix 2 errors</text>
<circle cx='190' cy='82' r='2' fill='var(--color-danger)'/>
<text x='198' y='85' font-size='6' fill='var(--color-danger)'>Email invalid</text>
<circle cx='190' cy='92' r='2' fill='var(--color-danger)'/>
<text x='198' y='95' font-size='6' fill='var(--color-danger)'>Required field</text>
<text x='360' y='50' font-size='9' text-anchor='middle' fill='var(--color-mute)'>Real-time</text>
<rect x='320' y='60' width='80' height='24' rx='4' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='335' y='75' font-size='8' fill='var(--color-mute)'>john@</text>
<rect x='320' y='90' width='80' height='3' rx='1.5' fill='var(--color-paper)'/>
<rect x='320' y='90' width='40' height='3' rx='1.5' fill='var(--color-warning)'/>
<text x='320' y='105' font-size='7' fill='var(--color-warning)'>Weak password</text>
</svg>
