<svg viewBox='0 0 640 180' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Light and dark theme mapping</title>
<text x='24' y='30' font-size='12' font-weight='600' fill='var(--color-ink)'>Theme Mapping</text>
<text x='60' y='60' font-size='9' fill='var(--color-mute)'>Light</text>
<rect x='60' y='70' width='120' height='80' rx='8' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='120' y='95' font-size='9' fill='var(--color-ink)'>--color-paper: #fff</text>
<text x='120' y='110' font-size='9' fill='var(--color-ink)'>--color-surface: #f9fafb</text>
<text x='60' y='170' font-size='9' fill='var(--color-mute)'>Dark</text>
<rect x='60' y='140' width='120' height='40' rx='8' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1' opacity='0.3'/>
<text x='120' y='165' font-size='9' fill='var(--color-ink)'>--color-paper: #0f172a</text>
<text x='120' y='185' font-size='9' fill='var(--color-ink)'>--color-surface: #111827</text>
</svg>
