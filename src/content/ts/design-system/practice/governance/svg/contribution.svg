<svg viewBox='0 0 640 180' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Contribution flow into a design system, from request to shipped component</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Contribution flow</text>
<rect x='24' y='48' width='132' height='88' rx='8' fill='var(--color-paper)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='90' y='76' font-size='9' text-anchor='middle' fill='var(--color-ink)'>a product team</text>
<text x='90' y='92' font-size='8' text-anchor='middle' fill='var(--color-mute)'>needs a pattern</text>
<text x='90' y='106' font-size='8' text-anchor='middle' fill='var(--color-mute)'>files a request</text>
<path d='M156 92 H188' stroke='var(--color-mute)' stroke-width='1.5'/>
<rect x='188' y='48' width='132' height='88' rx='8' fill='var(--color-paper)' stroke='var(--color-cobalt)' stroke-width='1.5'/>
<text x='254' y='76' font-size='9' text-anchor='middle' fill='var(--color-ink)'>the system team</text>
<text x='254' y='92' font-size='8' text-anchor='middle' fill='var(--color-mute)'>decides: token,</text>
<text x='254' y='106' font-size='8' text-anchor='middle' fill='var(--color-mute)'>component or guidance</text>
<path d='M320 92 H352' stroke='var(--color-mute)' stroke-width='1.5'/>
<rect x='352' y='48' width='132' height='88' rx='8' fill='var(--color-paper)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='418' y='76' font-size='9' text-anchor='middle' fill='var(--color-ink)'>shared work</text>
<text x='418' y='92' font-size='8' text-anchor='middle' fill='var(--color-mute)'>contribute back</text>
<text x='418' y='106' font-size='8' text-anchor='middle' fill='var(--color-mute)'>with a spec</text>
<path d='M484 92 H516' stroke='var(--color-mute)' stroke-width='1.5'/>
<rect x='516' y='48' width='100' height='88' rx='8' fill='var(--color-ink)' opacity='0.9'/>
<text x='566' y='86' font-size='9' text-anchor='middle' fill='var(--color-paper)'>shipped</text>
<text x='566' y='100' font-size='8' text-anchor='middle' fill='var(--color-paper)'>for all</text>
<text x='24' y='164' font-size='9' fill='var(--color-mute)'>Clear criteria turn "please add this" into a repeatable path.</text>
</svg>
