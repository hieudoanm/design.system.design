<svg viewBox='0 0 640 140' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Semantic color roles for feedback states</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Feedback Colors</text>
<rect x='24' y='40' width='100' height='60' rx='8' fill='var(--color-success-bg)' stroke='var(--color-success)' stroke-width='1'/>
<circle cx='44' cy='70' r='6' fill='var(--color-success)'/>
<text x='60' y='75' font-size='11' fill='var(--color-success)'>Success</text>
<rect x='144' y='40' width='100' height='60' rx='8' fill='var(--color-warning-bg)' stroke='var(--color-warning)' stroke-width='1'/>
<circle cx='164' cy='70' r='6' fill='var(--color-warning)'/>
<text x='180' y='75' font-size='11' fill='var(--color-warning)'>Warning</text>
<rect x='264' y='40' width='100' height='60' rx='8' fill='var(--color-danger-bg)' stroke='var(--color-danger)' stroke-width='1'/>
<circle cx='284' cy='70' r='6' fill='var(--color-danger)'/>
<text x='300' y='75' font-size='11' fill='var(--color-danger)'>Danger</text>
<rect x='384' y='40' width='100' height='60' rx='8' fill='var(--color-info-bg)' stroke='var(--color-info)' stroke-width='1'/>
<circle cx='404' cy='70' r='6' fill='var(--color-info)'/>
<text x='420' y='75' font-size='11' fill='var(--color-info)'>Info</text>
</svg>
