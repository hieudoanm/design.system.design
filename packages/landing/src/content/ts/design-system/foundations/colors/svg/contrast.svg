<svg viewBox='0 0 640 180' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Contrast ratio examples showing AA and AAA compliance</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Contrast Examples</text>
<rect x='24' y='40' width='180' height='60' rx='8' fill='#ffffff' stroke='var(--color-rule)' stroke-width='1'/>
<text x='114' y='75' font-size='14' text-anchor='middle' fill='#111827'>Body text</text>
<text x='204' y='75' font-size='11' fill='var(--color-success)'>4.6:1 ✓ AA</text>
<rect x='24' y='110' width='180' height='60' rx='8' fill='#f9fafb' stroke='var(--color-rule)' stroke-width='1'/>
<text x='114' y='145' font-size='14' text-anchor='middle' fill='#6b7280'>Muted text</text>
<text x='204' y='145' font-size='11' fill='var(--color-warning)'>3.2:1 ⚠</text>
<rect x='280' y='40' width='180' height='60' rx='8' fill='#1f4fd8'/>
<text x='370' y='75' font-size='14' text-anchor='middle' fill='#ffffff'>Action button</text>
<text x='460' y='75' font-size='11' fill='var(--color-success)'>8.2:1 ✓ AAA</text>
<rect x='280' y='110' width='180' height='60' rx='8' fill='#111827'/>
<text x='370' y='145' font-size='14' text-anchor='middle' fill='#f3f4f6'>Dark text</text>
<text x='460' y='145' font-size='11' fill='var(--color-success)'>15.3:1 ✓ AAA</text>
</svg>
