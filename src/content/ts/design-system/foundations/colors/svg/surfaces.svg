<svg viewBox='0 0 640 160' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Surface color hierarchy</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Surface Hierarchy</text>
<rect x='24' y='40' width='140' height='90' rx='10' fill='var(--color-paper)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='94' y='90' font-size='12' text-anchor='middle' fill='var(--color-ink)'>Paper</text>
<text x='94' y='105' font-size='9' text-anchor='middle' fill='var(--color-mute)'>Background</text>
<rect x='184' y='50' width='120' height='70' rx='8' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='244' y='90' font-size='11' text-anchor='middle' fill='var(--color-ink)'>Surface</text>
<text x='244' y='103' font-size='8' text-anchor='middle' fill='var(--color-mute)'>Default</text>
<rect x='324' y='60' width='100' height='50' rx='6' fill='var(--color-surface-raised)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='374' y='88' font-size='10' text-anchor='middle' fill='var(--color-ink)'>Raised</text>
<text x='374' y='100' font-size='8' text-anchor='middle' fill='var(--color-mute)'>Cards/Modals</text>
</svg>
