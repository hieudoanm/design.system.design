<svg viewBox='0 0 640 180' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Container with responsive max-width</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Responsive Container</text>
<g fill='var(--color-cobalt)' opacity='0.3'>
  <rect x='24' y='50' width='200' height='100' rx='8'/>
  <rect x='260' y='50' width='200' height='100' rx='8'/>
  <rect x='476' y='50' width='164' height='100' rx='8'/>
</g>
<rect x='24' y='50' width='200' height='100' rx='8' fill='var(--color-paper)'/>
<rect x='260' y='50' width='200' height='100' rx='8' fill='var(--color-paper)'/>
<rect x='476' y='50' width='164' height='100' rx='8' fill='var(--color-paper)'/>
<text x='124' y='90' font-size='9' text-anchor='middle' fill='var(--color-mute)'>container-1</text>
<text x='324' y='90' font-size='9' text-anchor='middle' fill='var(--color-mute)'>container-2</text>
<text x='564' y='90' font-size='9' text-anchor='middle' fill='var(--color-mute)'>container-3</text>
<g fill='var(--color-mute)' font-size='11'>
  <line x1='56' y1='50' x2='56' y2='150' stroke-width='1' stroke='var(--color-rule)'/>
  <line x1='320' y1='50' x2='320' y2='150' stroke-width='1' stroke='var(--color-rule)'/>
  <line x1='484' y1='50' x2='484' y2='150' stroke-width='1' stroke='var(--color-rule)'/>
</g>
</svg>
