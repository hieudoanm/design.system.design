<svg viewBox='0 0 640 200' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Form layout patterns: vertical, horizontal, and grid</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Form Layouts</text>
<text x='70' y='50' font-size='9' text-anchor='middle' fill='var(--color-mute)'>Vertical (Default)</text>
<rect x='30' y='60' width='80' height='8' rx='2' fill='var(--color-ink)' opacity='0.3'/>
<rect x='30' y='75' width='80' height='24' rx='4' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<rect x='30' y='110' width='80' height='8' rx='2' fill='var(--color-ink)' opacity='0.3'/>
<rect x='30' y='125' width='80' height='24' rx='4' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='70' y='175' font-size='8' text-anchor='middle' fill='var(--color-mute)'>stack vertically</text>
<text x='220' y='50' font-size='9' text-anchor='middle' fill='var(--color-mute)'>Horizontal</text>
<rect x='170' y='75' width='40' height='8' rx='2' fill='var(--color-ink)' opacity='0.3'/>
<rect x='220' y='65' width='80' height='24' rx='4' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<rect x='170' y='125' width='40' height='8' rx='2' fill='var(--color-ink)' opacity='0.3'/>
<rect x='220' y='115' width='80' height='24' rx='4' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='220' y='175' font-size='8' text-anchor='middle' fill='var(--color-mute)'>label beside input</text>
<text x='420' y='50' font-size='9' text-anchor='middle' fill='var(--color-mute)'>Grid Layout</text>
<rect x='370' y='65' width='80' height='24' rx='4' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<rect x='460' y='65' width='80' height='24' rx='4' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<rect x='370' y='100' width='170' height='24' rx='4' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<rect x='370' y='135' width='80' height='24' rx='4' fill='var(--color-action-bg)'/>
<text x='410' y='150' font-size='8' text-anchor='middle' fill='#ffffff'>Submit</text>
<text x='420' y='175' font-size='8' text-anchor='middle' fill='var(--color-mute)'>responsive grid</text>
</svg>
