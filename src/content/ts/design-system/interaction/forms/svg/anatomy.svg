<svg viewBox='0 0 640 200' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Form field anatomy with label, input, hint, and error</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Form Field Anatomy</text>
<text x='60' y='55' font-size='11' fill='var(--color-ink)'>Label</text>
<rect x='60' y='65' width='260' height='40' rx='6' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<text x='75' y='88' font-size='10' fill='var(--color-mute)'>Enter your email</text>
<text x='60' y='125' font-size='9' fill='var(--color-mute)'>Hint text helps users understand the field</text>
<text x='60' y='155' font-size='11' fill='var(--color-ink)'>Label</text>
<rect x='60' y='165' width='260' height='40' rx='6' fill='var(--color-surface)' stroke='var(--color-danger)' stroke-width='1.5'/>
<text x='75' y='188' font-size='10' fill='var(--color-ink)'>invalid@</text>
<text x='60' y='225' font-size='9' fill='var(--color-danger)'>Please enter a valid email address</text>
<text x='360' y='55' font-size='10' fill='var(--color-mute)'>1. Label</text>
<text x='360' y='75' font-size='10' fill='var(--color-mute)'>2. Input field</text>
<text x='360' y='95' font-size='10' fill='var(--color-mute)'>3. Hint text</text>
<text x='360' y='115' font-size='10' fill='var(--color-mute)'>4. Error message</text>
<text x='360' y='155' font-size='10' fill='var(--color-mute)'>5. Required indicator</text>
<text x='360' y='175' font-size='10' fill='var(--color-mute)'>6. Focus state</text>
</svg>
