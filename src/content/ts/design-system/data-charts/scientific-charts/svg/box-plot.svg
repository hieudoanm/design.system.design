<line x1='90' y1='150' x2='120' y2='150' stroke-width='2' />
</g>
<circle cx='105' cy='225' r='3' fill='var(--color-chart-1)' /><circle cx='105' cy='70' r='3' fill='var(--color-chart-1)' />
<g stroke='var(--color-chart-2)' stroke-width='1.5'>
<line x1='200' y1='80' x2='200' y2='100' />
<line x1='200' y1='190' x2='200' y2='160' />
<line x1='185' y1='80' x2='215' y2='80' />
