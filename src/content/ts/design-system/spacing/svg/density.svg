<svg viewBox='0 0 640 160' width='100%' role='img' xmlns='http://www.w3.org/2000/svg'>
<title>Spacing density variations for different contexts</title>
<text x='24' y='24' font-size='12' font-weight='600' fill='var(--color-ink)'>Density</text>
<text x='80' y='50' font-size='9' text-anchor='middle' fill='var(--color-mute)'>Compact</text>
<rect x='40' y='60' width='80' height='70' rx='6' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<rect x='50' y='70' width='60' height='12' rx='2' fill='var(--color-action-bg)' opacity='0.3'/>
<rect x='50' y='88' width='60' height='12' rx='2' fill='var(--color-action-bg)' opacity='0.3'/>
<rect x='50' y='106' width='40' height='12' rx='2' fill='var(--color-action-bg)' opacity='0.5'/>
<text x='70' y='148' font-size='8' text-anchor='middle' fill='var(--color-mute)'>space-2/3</text>
<text x='200' y='50' font-size='9' text-anchor='middle' fill='var(--color-mute)'>Default</text>
<rect x='160' y='60' width='80' height='70' rx='6' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<rect x='170' y='70' width='60' height='12' rx='2' fill='var(--color-action-bg)' opacity='0.3'/>
<rect x='170' y='92' width='60' height='12' rx='2' fill='var(--color-action-bg)' opacity='0.3'/>
<rect x='170' y='114' width='40' height='12' rx='2' fill='var(--color-action-bg)' opacity='0.5'/>
<text x='200' y='148' font-size='8' text-anchor='middle' fill='var(--color-mute)'>space-3/4</text>
<text x='320' y='50' font-size='9' text-anchor='middle' fill='var(--color-mute)'>Comfortable</text>
<rect x='280' y='60' width='80' height='70' rx='6' fill='var(--color-surface)' stroke='var(--color-rule)' stroke-width='1'/>
<rect x='290' y='70' width='60' height='12' rx='2' fill='var(--color-action-bg)' opacity='0.3'/>
<rect x='290' y='96' width='60' height='12' rx='2' fill='var(--color-action-bg)' opacity='0.3'/>
<rect x='290' y='122' width='40' height='12' rx='2' fill='var(--color-action-bg)' opacity='0.5'/>
<text x='320' y='148' font-size='8' text-anchor='middle' fill='var(--color-mute)'>space-4/6</text>
</svg>
