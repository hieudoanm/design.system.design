name: CI

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm --filter design.system.design lint
      # Unit tests with the 80% coverage threshold from vitest.config.mts.
      - name: Test
        run: pnpm test:coverage
      # Browser tests: the exported site, driven with Playwright.
      - name: Install Playwright Browsers
        working-directory: packages/landing
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser Test
        working-directory: packages/landing
        run: pnpm e2e
      # `pnpm build` runs `prebuild` first: eslint, then prettier --check.
      # `next build` writes the static export to out/.
      - name: Build
        run: pnpm build
      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out/
          retention-days: 1

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
